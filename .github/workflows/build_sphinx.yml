# This is the github action that builds the documentation and posts it to github-pages
name: "Sphinx: Render docs"

on: 
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    tags:
      - 'v[0-9]*.*'      # v1, v1.2, v1.2.3, v2025.09.04, etc.
      - '[0-9]*\.[0-9]*\.*'  # 1, 1.2, 1.2.3, 2025.09.04, etc.  
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    env:
      SETUPTOOLS_SCM_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get cache period
        id: cache-period
        run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: bds_doc
          conda-remove-defaults: true

      # The full SCHISM environment is slow to solve and download, so cache it.
      # The key changes when either YAML changes, and weekly so that unpinned
      # packages are still refreshed. Bump CACHE_NUMBER to force a rebuild.
      - name: Cache Conda environment
        id: env-cache
        uses: actions/cache@v4
        env:
          CACHE_NUMBER: 0
        with:
          path: ${{ env.CONDA }}/envs
          key: conda-${{ runner.os }}-${{ runner.arch }}-${{ env.CACHE_NUMBER }}-${{ steps.cache-period.outputs.week }}-${{ hashFiles('schism_env.yml', 'environment-doc.yml') }}

      - name: Create runtime environment plus documentation overlay
        if: steps.env-cache.outputs.cache-hit != 'true'
        run: |
          conda env update -n bds_doc -f schism_env.yml
          conda env update -n bds_doc -f environment-doc.yml

      - name: Install checkout
        run: python -m pip install --no-deps --no-build-isolation -e ./bdschism

      - name: Build Sphinx
        run: |
          make -C docsrc clean
          make -C docsrc html

      # Upload the built site as a Pages artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4